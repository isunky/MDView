name: Verify and build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to build
        required: true
        type: string
      build_installers:
        description: Build Windows and macOS installers
        required: true
        type: boolean
      build_updater_artifacts:
        description: Create signed Windows updater artifacts
        required: false
        default: false
        type: boolean
      retention_days:
        description: Artifact retention period
        required: false
        default: 7
        type: number
    secrets:
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      WINDOWS_CERTIFICATE_THUMBPRINT:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Test, lint, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  windows:
    name: Build Windows MSI and portable ZIP
    if: ${{ inputs.build_installers }}
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 30
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-msi

      - name: Install dependencies
        run: npm ci

      - name: Import Windows signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' && env.WINDOWS_CERTIFICATE_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "mdview-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

          $configPath = Join-Path $env:RUNNER_TEMP "tauri-signing.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $configPath -Encoding UTF8

          "TAURI_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate updater signing secrets
        if: ${{ inputs.build_updater_artifacts }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be configured for release updater artifacts."
          }

      - name: Clean previous Windows bundle outputs
        shell: pwsh
        run: |
          Remove-Item -LiteralPath src-tauri\target\release\bundle\msi -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath src-tauri\target\release\bundle\portable -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build MSI
        shell: pwsh
        run: |
          $configPaths = @()
          if ($env:TAURI_SIGNING_CONFIG) {
            $configPaths += $env:TAURI_SIGNING_CONFIG
          }

          if ('${{ inputs.build_updater_artifacts }}' -eq 'true') {
            $updaterConfigPath = Join-Path $env:RUNNER_TEMP "tauri-updater-artifacts.json"
            @{ bundle = @{ createUpdaterArtifacts = $true } } | ConvertTo-Json -Depth 4 | Set-Content -Path $updaterConfigPath -Encoding UTF8
            $configPaths += $updaterConfigPath
          }

          $configArgs = @()
          foreach ($configPath in $configPaths) {
            $configArgs += @('--config', $configPath)
          }

          npm run tauri -- build --bundles msi --ci @configArgs

      - name: Build portable ZIP
        shell: pwsh
        run: npm run portable:windows

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdview-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload updater signature artifact
        if: ${{ inputs.build_updater_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: mdview-windows-updater-signature
          path: src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdview-windows-portable
          path: src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  macos:
    name: Build macOS Universal DMG
    if: ${{ inputs.build_installers }}
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 45
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust with macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - name: Install dependencies
        run: npm ci

      - name: Clean previous macOS bundle output
        run: rm -rf src-tauri/target/universal-apple-darwin/release/bundle/dmg

      - name: Build universal DMG
        run: npm run tauri -- build --bundles dmg --target universal-apple-darwin --ci --no-sign

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdview-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
