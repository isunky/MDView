name: Verify and build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to build
        required: true
        type: string
      build_installers:
        description: Build Windows and macOS installers
        required: true
        type: boolean
      sign_windows_artifacts:
        description: Submit release Windows artifacts to SignPath for Authenticode signing
        required: false
        default: false
        type: boolean
      sign_updater_artifacts:
        description: Create Tauri updater signatures for the Windows MSI
        required: false
        default: false
        type: boolean
      retention_days:
        description: Artifact retention period
        required: false
        default: 7
        type: number
    secrets:
      SIGNPATH_API_TOKEN:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  quality:
    name: Test, lint, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run version:check

      - name: Run unit tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Edge extension package
        run: npm run edge:package

      - name: Upload Edge extension package
        uses: actions/upload-artifact@v6
        with:
          name: mdview-edge-extension
          path: dist/MDView-edge.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  windows:
    name: Build Windows MSI and portable ZIP
    if: ${{ inputs.build_installers }}
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 90
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: mdview
      SIGNPATH_SIGNING_POLICY_SLUG: release-signing
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: windows-release
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-msi

      - name: Install dependencies
        run: npm ci

      - name: Validate release signing configuration
        if: ${{ inputs.sign_windows_artifacts }}
        shell: pwsh
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID'
          )

          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Release signing is enabled, but these GitHub configuration values are missing: $($missing -join ', ')."
          }

      - name: Validate updater signing configuration
        if: ${{ inputs.sign_updater_artifacts }}
        shell: pwsh
        run: |
          $required = @(
            'TAURI_SIGNING_PRIVATE_KEY',
            'TAURI_SIGNING_PRIVATE_KEY_PASSWORD'
          )

          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Updater signing is enabled, but these GitHub secrets are missing: $($missing -join ', ')."
          }

      - name: Read package version
        id: package-version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Clean previous Windows bundle outputs
        shell: pwsh
        run: |
          Remove-Item -LiteralPath src-tauri\target\release\bundle\msi -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath src-tauri\target\release\bundle\portable -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath src-tauri\target\release\bundle\setup -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build unsigned MSI
        shell: pwsh
        run: npm run tauri -- build --bundles msi --ci

      - name: Stage unsigned Windows artifacts for SignPath
        if: ${{ inputs.sign_windows_artifacts }}
        shell: pwsh
        run: |
          $stagingPath = Join-Path $env:RUNNER_TEMP 'mdview-signpath-input'
          Remove-Item -LiteralPath $stagingPath -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stagingPath | Out-Null

          $msiFiles = @(Get-ChildItem -Path src-tauri\target\release\bundle\msi -Filter '*.msi' -File)
          $exe = Get-Item -LiteralPath src-tauri\target\release\MDView.exe
          if ($msiFiles.Count -ne 2 -or -not $exe) {
            throw 'Expected en-US and zh-CN MSI files plus MDView.exe.'
          }

          $msiFiles | Copy-Item -Destination $stagingPath
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $stagingPath $exe.Name)

      - name: Upload unsigned Windows artifacts
        if: ${{ inputs.sign_windows_artifacts }}
        id: upload-signpath-input
        uses: actions/upload-artifact@v6
        with:
          name: mdview-signpath-input-${{ github.run_id }}
          path: ${{ runner.temp }}/mdview-signpath-input
          if-no-files-found: error
          retention-days: 1

      - name: Submit Windows artifacts to SignPath
        if: ${{ inputs.sign_windows_artifacts }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mdview
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release
          github-artifact-id: ${{ steps.upload-signpath-input.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 4800
          output-artifact-directory: ${{ runner.temp }}/mdview-signpath-output
          parameters: |
            version: ${{ toJSON(steps.package-version.outputs.value) }}

      - name: Install and verify signed Windows artifacts
        if: ${{ inputs.sign_windows_artifacts }}
        shell: pwsh
        run: |
          $signedRoot = Join-Path $env:RUNNER_TEMP 'mdview-signpath-output'
          $signedMsiFiles = @(Get-ChildItem -Path $signedRoot -Recurse -Filter '*.msi' -File)
          $signedExe = Get-ChildItem -Path $signedRoot -Recurse -Filter 'MDView.exe' -File | Select-Object -First 1
          if ($signedMsiFiles.Count -ne 2 -or -not $signedExe) {
            throw 'SignPath did not return both localized MSI files and signed MDView.exe.'
          }

          foreach ($artifact in @($signedMsiFiles) + @($signedExe)) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
              throw "Invalid SignPath signature on $($artifact.Name): $($signature.Status) $($signature.SignerCertificate.Subject)"
            }
          }

          $msiOutput = Join-Path $PWD 'src-tauri\target\release\bundle\msi'
          $signedMsiFiles | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $msiOutput $_.Name) -Force
          }
          Copy-Item -LiteralPath $signedExe.FullName -Destination 'src-tauri\target\release\MDView.exe' -Force

      - name: Create updater signature
        if: ${{ inputs.sign_updater_artifacts }}
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri\target\release\bundle\msi -Filter '*_en-US.msi' -File | Select-Object -First 1
          if (-not $msi) {
            throw 'The canonical en-US updater MSI was not found.'
          }
          $signaturePath = "$($msi.FullName).sig"
          Remove-Item -LiteralPath $signaturePath -Force -ErrorAction SilentlyContinue
          npm run tauri -- signer sign $msi.FullName
          if (-not (Test-Path -LiteralPath $signaturePath) -or [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $signaturePath -Raw))) {
            throw 'Tauri updater signature was not created for the signed MSI.'
          }

      - name: Build bilingual offline setup
        shell: pwsh
        run: npm run setup:windows

      - name: Stage bilingual setup for SignPath
        if: ${{ inputs.sign_windows_artifacts }}
        shell: pwsh
        run: |
          $stagingPath = Join-Path $env:RUNNER_TEMP 'mdview-setup-signpath-input'
          Remove-Item -LiteralPath $stagingPath -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stagingPath | Out-Null
          $setup = Get-ChildItem -Path src-tauri\target\release\bundle\setup -Filter '*.exe' -File | Select-Object -First 1
          if (-not $setup) {
            throw 'The bilingual setup executable was not found.'
          }
          Copy-Item -LiteralPath $setup.FullName -Destination (Join-Path $stagingPath $setup.Name)

      - name: Upload unsigned bilingual setup
        if: ${{ inputs.sign_windows_artifacts }}
        id: upload-setup-signpath-input
        uses: actions/upload-artifact@v6
        with:
          name: mdview-setup-signpath-input-${{ github.run_id }}
          path: ${{ runner.temp }}/mdview-setup-signpath-input
          if-no-files-found: error
          retention-days: 1

      - name: Submit bilingual setup to SignPath
        if: ${{ inputs.sign_windows_artifacts }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mdview
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release
          github-artifact-id: ${{ steps.upload-setup-signpath-input.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 4800
          output-artifact-directory: ${{ runner.temp }}/mdview-setup-signpath-output
          parameters: |
            version: ${{ toJSON(steps.package-version.outputs.value) }}

      - name: Install and verify signed bilingual setup
        if: ${{ inputs.sign_windows_artifacts }}
        shell: pwsh
        run: |
          $signedSetup = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'mdview-setup-signpath-output') -Recurse -Filter '*_setup.exe' -File | Select-Object -First 1
          if (-not $signedSetup) {
            throw 'SignPath did not return the signed bilingual setup.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $signedSetup.FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "Invalid SignPath signature on $($signedSetup.Name): $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          Copy-Item -LiteralPath $signedSetup.FullName -Destination (Join-Path 'src-tauri\target\release\bundle\setup' $signedSetup.Name) -Force

      - name: Build portable ZIP
        shell: pwsh
        run: npm run portable:windows

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $checksumPath = 'src-tauri\target\release\bundle\SHA256SUMS.txt'
          $artifacts = @(
            Get-ChildItem -Path src-tauri\target\release\bundle\msi -Filter '*.msi' -File
            Get-ChildItem -Path src-tauri\target\release\bundle\portable -Filter '*.zip' -File
            Get-ChildItem -Path src-tauri\target\release\bundle\setup -Filter '*.exe' -File
          )
          if ($artifacts.Count -ne 4) {
            throw 'Expected two localized MSI files, one bilingual setup, and one portable ZIP to checksum.'
          }
          $artifacts | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v6
        with:
          name: mdview-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload updater signature artifact
        if: ${{ inputs.sign_updater_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: mdview-windows-updater-signature
          path: src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload bilingual setup artifact
        uses: actions/upload-artifact@v6
        with:
          name: mdview-windows-setup
          path: src-tauri/target/release/bundle/setup/*.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: mdview-windows-portable
          path: src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload Windows checksums
        uses: actions/upload-artifact@v6
        with:
          name: mdview-windows-checksums
          path: src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  macos:
    name: Build macOS Universal DMG
    if: ${{ inputs.build_installers }}
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 45
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust with macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - name: Install dependencies
        run: npm ci

      - name: Clean previous macOS bundle output
        run: rm -rf src-tauri/target/universal-apple-darwin/release/bundle/dmg

      - name: Build universal DMG
        run: npm run tauri -- build --bundles dmg --target universal-apple-darwin --ci

      - name: Verify signed macOS bundle and DMG
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          if [[ -z "$dmg_path" ]]; then
            echo "::error::Expected macOS DMG was not produced."
            exit 1
          fi

          hdiutil verify "$dmg_path"

          mount_path="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_path" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_path" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_path" >/dev/null
          mounted_app_path="$(find "$mount_path" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$mounted_app_path" ]]; then
            echo "::error::The mounted DMG does not contain an app bundle."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$mounted_app_path"
          codesign_details="$(codesign -dv --verbose=4 "$mounted_app_path" 2>&1)"
          printf '%s\n' "$codesign_details"
          grep -q 'Signature=adhoc' <<< "$codesign_details"

          architectures="$(lipo -archs "$mounted_app_path/Contents/MacOS/mdview")"
          printf 'Universal architectures: %s\n' "$architectures"
          [[ "$architectures" == *"arm64"* && "$architectures" == *"x86_64"* ]]

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: mdview-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
