name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  pipeline:
    name: Quality and optional installers
    if: >-
      ${{
        github.event_name != 'push' ||
        github.actor != 'github-actions[bot]' ||
        startsWith(github.event.head_commit.message, 'chore: release v') == false
      }}
    uses: ./.github/workflows/_pipeline.yml
    with:
      ref: ${{ github.sha }}
      build_installers: ${{ github.event_name == 'workflow_dispatch' }}
      retention_days: 14
    secrets: inherit
