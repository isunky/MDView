name: Edge Add-ons

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Submit the uploaded package for Edge Add-ons certification
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Build Edge extension ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
      EDGE_ADDONS_CLIENT_ID: ${{ vars.EDGE_ADDONS_CLIENT_ID }}
      EDGE_ADDONS_PRODUCT_ID: ${{ vars.EDGE_ADDONS_PRODUCT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run version:check

      - name: Build package
        run: npm run edge:package

      - name: Upload Edge extension ZIP
        uses: actions/upload-artifact@v6
        with:
          name: mdview-edge-extension
          path: dist/MDView-edge.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload and submit Edge Add-ons update
        if: >-
          ${{
            (github.event_name == 'push' || inputs.publish) &&
            env.EDGE_ADDONS_API_KEY != '' &&
            env.EDGE_ADDONS_CLIENT_ID != '' &&
            env.EDGE_ADDONS_PRODUCT_ID != ''
          }}
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_ADDONS_PRODUCT_ID}/submissions"
          headers=(
            -H "Authorization: ApiKey ${EDGE_ADDONS_API_KEY}"
            -H "X-ClientID: ${EDGE_ADDONS_CLIENT_ID}"
          )
          upload_headers="$(mktemp)"
          publish_headers="$(mktemp)"
          trap 'rm -f "$upload_headers" "$publish_headers"' EXIT

          read_operation_id() {
            local header_file="$1"
            local location
            location="$(awk 'tolower($1) == "location:" { print $2 }' "$header_file" | tr -d '\r' | tail -n 1)"
            location="${location%%\?*}"
            location="${location%/}"
            printf '%s' "${location##*/}"
          }

          poll_operation() {
            local operation_url="$1"
            local operation_name="$2"
            local response
            local status

            for attempt in {1..60}; do
              response="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$operation_url")"
              status="$(jq -r '.status // empty' <<< "$response")"
              case "$status" in
                Succeeded|Success|Completed)
                  echo "Edge Add-ons ${operation_name} completed."
                  return 0
                  ;;
                Failed|Error)
                  echo "::error::Edge Add-ons ${operation_name} failed."
                  jq -c '{status, message, errorCode, errors}' <<< "$response"
                  return 1
                  ;;
                *)
                  if [[ "$attempt" == 60 ]]; then
                    echo "::error::Timed out while Edge Add-ons processed ${operation_name} (last status: ${status:-unknown})."
                    jq -c '{status, message, errorCode, errors}' <<< "$response"
                    return 1
                  fi
                  sleep 5
                  ;;
              esac
            done
          }

          curl --fail-with-body --request POST \
            "${headers[@]}" \
            -H 'Content-Type: application/zip' \
            --dump-header "$upload_headers" \
            --output /dev/null \
            --upload-file dist/MDView-edge.zip \
            "${base_url}/draft/package"

          upload_operation_id="$(read_operation_id "$upload_headers")"
          if [[ -z "$upload_operation_id" ]]; then
            echo '::error::Edge Add-ons did not return a package upload operation ID.'
            exit 1
          fi

          poll_operation \
            "${base_url}/draft/package/operations/${upload_operation_id}" \
            'package upload'

          curl --fail-with-body --request POST \
            "${headers[@]}" \
            -H 'Content-Type: application/json' \
            --dump-header "$publish_headers" \
            --output /dev/null \
            --data "{\"notes\":\"MDView ${RELEASE_VERSION} automated release.\"}" \
            "${base_url}"

          publish_operation_id="$(read_operation_id "$publish_headers")"
          if [[ -z "$publish_operation_id" ]]; then
            echo '::error::Edge Add-ons did not return a publication operation ID.'
            exit 1
          fi

          poll_operation \
            "${base_url}/operations/${publish_operation_id}" \
            'publication'

      - name: Explain skipped publication
        if: >-
          ${{
            (github.event_name == 'push' || inputs.publish) &&
            (env.EDGE_ADDONS_API_KEY == '' || env.EDGE_ADDONS_CLIENT_ID == '' || env.EDGE_ADDONS_PRODUCT_ID == '')
          }}
        run: echo 'Edge Add-ons publish skipped because the optional API credentials are not configured.'
