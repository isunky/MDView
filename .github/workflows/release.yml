name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Generate or validate version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            current_version="$(node -p "require('./package.json').version")"
            IFS='.' read -r major minor patch <<< "$current_version"

            case "$RELEASE_BUMP" in
              patch)
                version="$major.$minor.$((patch + 1))"
                ;;
              minor)
                version="$major.$((minor + 1)).0"
                ;;
              major)
                version="$((major + 1)).0.0"
                ;;
              *)
                echo "::error::Unsupported version increment: $RELEASE_BUMP"
                exit 1
                ;;
            esac

            tag="v$version"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi

            npm run version:sync -- "$version"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md package.json package-lock.json src/appInfo.ts \
              src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
            git commit -m "chore: release $tag"
            git push origin "HEAD:$DEFAULT_BRANCH"
            sha="$(git rev-parse HEAD)"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use the format v1.2.3."
              exit 1
            fi

            package_version="$(node -p "require('./package.json').version")"
            if [[ "$package_version" != "$version" ]]; then
              echo "::error::Tag $tag does not match package version $package_version."
              exit 1
            fi

            sha="$GITHUB_SHA"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Prepared MDView $version from $sha"

  pipeline:
    name: Verify and build release artifacts
    needs: prepare
    uses: ./.github/workflows/_pipeline.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      build_installers: true
      build_updater_artifacts: true
      retention_days: 7
    secrets: inherit

  publish:
    name: Create Tag and GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - pipeline
    timeout-minutes: 10

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Windows updater manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          msi_path="$(find release-assets -maxdepth 1 -type f -name "*_${RELEASE_VERSION}_*.msi" -print -quit)"
          signature_path="${msi_path}.sig"

          if [[ -z "$msi_path" || ! -f "$signature_path" ]]; then
            echo "::error::Expected a Windows MSI and matching updater signature artifact."
            exit 1
          fi

          node scripts/generate-updater-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --msi "$msi_path" \
            --signature "$signature_path" \
            --output release-assets/latest.json

      - name: Publish Windows and macOS installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: MDView ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: |
            release-assets/*.msi
            release-assets/*.msi.sig
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/latest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
