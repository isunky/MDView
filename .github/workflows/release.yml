name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Generate or validate version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            current_version="$(node -p "require('./package.json').version")"
            IFS='.' read -r major minor patch <<< "$current_version"

            case "$RELEASE_BUMP" in
              patch)
                version="$major.$minor.$((patch + 1))"
                ;;
              minor)
                version="$major.$((minor + 1)).0"
                ;;
              major)
                version="$((major + 1)).0.0"
                ;;
              *)
                echo "::error::Unsupported version increment: $RELEASE_BUMP"
                exit 1
                ;;
            esac

            tag="v$version"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi

            npm run version:sync -- "$version"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md package.json package-lock.json src/appInfo.ts \
              src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
            git commit -m "chore: release $tag"
            git push origin "HEAD:$DEFAULT_BRANCH"
            sha="$(git rev-parse HEAD)"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use the format v1.2.3."
              exit 1
            fi

            package_version="$(node -p "require('./package.json').version")"
            if [[ "$package_version" != "$version" ]]; then
              echo "::error::Tag $tag does not match package version $package_version."
              exit 1
            fi

            sha="$GITHUB_SHA"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Prepared MDView $version from $sha"

  quality:
    name: Test, lint, build, and E2E
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 20

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

  windows:
    name: Build Windows MSI and portable ZIP
    runs-on: windows-latest
    needs:
      - prepare
      - quality
    timeout-minutes: 30
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-msi

      - name: Install dependencies
        run: npm ci

      - name: Import Windows signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' && env.WINDOWS_CERTIFICATE_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "mdview-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

          $configPath = Join-Path $env:RUNNER_TEMP "tauri-signing.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $configPath -Encoding UTF8

          "TAURI_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_CONFIG) {
            npm run tauri -- build --bundles msi --ci --config "$env:TAURI_SIGNING_CONFIG"
          } else {
            npm run tauri -- build --bundles msi --ci
          }

      - name: Build portable ZIP
        shell: pwsh
        run: npm run portable:windows

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdview-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdview-windows-portable
          path: src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    needs:
      - prepare
      - quality
    timeout-minutes: 45
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust with macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG
        run: npm run tauri -- build --bundles dmg --target universal-apple-darwin --ci --no-sign

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdview-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create Tag and GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - windows
      - macos
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Windows and macOS installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: MDView ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: |
            release-assets/*.msi
            release-assets/*.zip
            release-assets/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
