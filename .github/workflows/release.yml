name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      notes: ${{ steps.release.outputs.notes }}
      authenticode_signing_enabled: ${{ steps.release.outputs.authenticode_signing_enabled }}
      updater_signing_enabled: ${{ steps.release.outputs.updater_signing_enabled }}
      signing_notes: ${{ steps.release.outputs.signing_notes }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Generate or validate version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          required_authenticode_values=(
            SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID
          )
          missing_authenticode_values=()
          for value_name in "${required_authenticode_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              missing_authenticode_values+=("$value_name")
            fi
          done

          required_updater_values=(
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )
          missing_updater_values=()
          for value_name in "${required_updater_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              missing_updater_values+=("$value_name")
            fi
          done

          if [[ ${#missing_authenticode_values[@]} -eq 0 ]]; then
            authenticode_signing_enabled=true
            signing_notes=$'## Code signing / 代码签名\n\nWindows release artifacts are signed through SignPath after manual approval. See the [code signing policy](https://github.com/isunky/MDView/blob/main/CODE_SIGNING_POLICY.md).\n\nWindows 发布包经人工审批后由 SignPath 签名。详见[代码签名政策](https://github.com/isunky/MDView/blob/main/CODE_SIGNING_POLICY.md)。'
          else
            authenticode_signing_enabled=false
            signing_notes=$'## Code signing / 代码签名\n\nThis release is not Authenticode-signed because optional SignPath configuration is unavailable. Windows may show a security warning.\n\n本版本未进行 Authenticode 代码签名，因为可选的 SignPath 配置尚未完成。Windows 可能显示安全提示。'
            echo "::warning::Authenticode signing is disabled because these configuration values are missing: ${missing_authenticode_values[*]}"
          fi

          if [[ ${#missing_updater_values[@]} -eq 0 ]]; then
            updater_signing_enabled=true
            signing_notes+=$'\n\n## Automatic updates / 自动更新\n\nThe MSI includes verified in-app updates.\n\nMSI 安装版支持已验证的应用内自动更新。'
          else
            updater_signing_enabled=false
            signing_notes+=$'\n\n## Automatic updates / 自动更新\n\nIn-app updates are unavailable because Tauri updater signing is not configured.\n\n应用内自动更新不可用，因为 Tauri 更新签名尚未配置。'
            echo "::warning::Updater signing is disabled because these GitHub secrets are missing: ${missing_updater_values[*]}"
          fi

          signing_notes+=$'\n\n## macOS installation / macOS 安装\n\nThe Universal DMG is ad-hoc signed to prevent macOS from treating the GitHub download as damaged. It is not Apple-notarized, so macOS may require one-time approval through right-click **Open** or **Privacy & Security**. Download the DMG directly from this release; do not redistribute the extracted `.app` bundle.\n\nUniversal DMG 已进行 ad-hoc 签名，避免 macOS 将 GitHub 下载内容判定为“已损坏”。该版本尚未完成 Apple 公证，首次启动可能仍需右键选择“打开”，或在“隐私与安全性”中允许。请直接从本 Release 下载 DMG，不要转发解压后的 `.app` 应用包。'
          echo "authenticode_signing_enabled=$authenticode_signing_enabled" >> "$GITHUB_OUTPUT"
          echo "updater_signing_enabled=$updater_signing_enabled" >> "$GITHUB_OUTPUT"
          {
            echo 'signing_notes<<EOF'
            echo "$signing_notes"
            echo EOF
          } >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            previous_tag="$(git tag --merged HEAD --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -n "$previous_tag" ]]; then
              commit_range="${previous_tag}..HEAD"
              compare_url="https://github.com/${REPOSITORY}/compare/${previous_tag}...HEAD"
            else
              commit_range="HEAD"
              compare_url="https://github.com/${REPOSITORY}/commits/HEAD"
            fi
            commit_notes="$(git log "$commit_range" -n 20 --invert-grep --grep='^chore: release v' --pretty=format:'- %s (`%h`)' || true)"
            if [[ -z "$commit_notes" ]]; then
              commit_notes='- Maintenance release.'
            fi
            {
              echo 'notes<<EOF'
              echo "## What's new / 本次更新"
              echo
              echo "$commit_notes"
              echo
              echo "[View full changelog](${compare_url})"
              echo EOF
            } >> "$GITHUB_OUTPUT"

            current_version="$(node -p "require('./package.json').version")"
            IFS='.' read -r major minor patch <<< "$current_version"

            case "$RELEASE_BUMP" in
              patch)
                version="$major.$minor.$((patch + 1))"
                ;;
              minor)
                version="$major.$((minor + 1)).0"
                ;;
              major)
                version="$((major + 1)).0.0"
                ;;
              *)
                echo "::error::Unsupported version increment: $RELEASE_BUMP"
                exit 1
                ;;
            esac

            tag="v$version"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi

            npm run version:sync -- "$version"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md package.json package-lock.json src/appInfo.ts edge/public/manifest.json \
              src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
            git commit -m "chore: release $tag"
            git push origin "HEAD:$DEFAULT_BRANCH"
            sha="$(git rev-parse HEAD)"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use the format v1.2.3."
              exit 1
            fi

            package_version="$(node -p "require('./package.json').version")"
            if [[ "$package_version" != "$version" ]]; then
              echo "::error::Tag $tag does not match package version $package_version."
              exit 1
            fi

            sha="$GITHUB_SHA"
            echo 'notes=' >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Prepared MDView $version from $sha"

  pipeline:
    name: Verify and build release artifacts
    needs: prepare
    uses: ./.github/workflows/_pipeline.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      build_installers: true
      sign_windows_artifacts: ${{ needs.prepare.outputs.authenticode_signing_enabled == 'true' }}
      sign_updater_artifacts: ${{ needs.prepare.outputs.updater_signing_enabled == 'true' }}
      retention_days: 7
    secrets: inherit

  publish:
    name: Create Tag and GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - pipeline
    timeout-minutes: 10

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Windows updater manifest
        if: ${{ needs.prepare.outputs.updater_signing_enabled == 'true' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          msi_path="$(find release-assets -maxdepth 1 -type f -name "*_${RELEASE_VERSION}_*.msi" -print -quit)"
          if [[ -z "$msi_path" ]]; then
            echo "::error::Expected a Windows MSI artifact."
            exit 1
          fi

          signature_path="${msi_path}.sig"
          if [[ ! -f "$signature_path" ]]; then
            echo "::error::Expected a matching Tauri updater signature."
            exit 1
          fi

          node scripts/generate-updater-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --msi "$msi_path" \
            --signature "$signature_path" \
            --output release-assets/latest.json

      - name: Publish Windows and macOS installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: MDView ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
          body: |
            ${{ needs.prepare.outputs.notes }}

            ${{ needs.prepare.outputs.signing_notes }}
