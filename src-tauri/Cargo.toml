[package]
name = "mdview"
version = "2.3.2"
description = "A lightweight Markdown viewer and source editor."
authors = ["MDView"]
license = "Apache-2.0"
repository = "https://github.com/isunky/MDView"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["webview-data-url"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
url = "2"
base64 = "0.22"
tauri-plugin-opener = "2"
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls", "stream"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2"
